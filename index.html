<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Vidéo - Style Love Is All</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #e91e63; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #c2185b; }
        .secours-btn { background-color: #007bff; margin-top: 10px; }
        .secours-btn:hover { background-color: #0056b3; }
        #output { margin-top: 25px; padding: 15px; background: #e9ecef; border-left: 5px solid #e91e63; min-height: 50px; white-space: pre-wrap; }
        .preview-box { margin-top: 10px; max-width: 200px; display: none; border-radius: 4px; overflow: hidden; }
        .preview-box img { width: 100%; height: auto; display: block; }
        .video-result { margin-top: 20px; width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .progress-bar-container { background-color: #ddd; border-radius: 4px; margin-top: 10px; display: none; }
        .progress-bar { height: 10px; background-color: #28a745; width: 0%; border-radius: 4px; transition: width 0.4s ease; }
    </style>
</head>
<body>

<div class="container">
    <h2>Créateur de Clip (Style "Love Is All")</h2>
    
    <label for="apiKey">Votre Clé API (Agnes AI) :</label>
    <input type="password" id="apiKey" placeholder="Entrez votre clé agnes_xxx...">

    <label for="imageFileInput">Image locale de référence (Illustration de votre dandy) :</label>
    <input type="file" id="imageFileInput" accept="image/*" onchange="previewLocalImage(event)">

    <div class="preview-box" id="previewContainer">
        <img id="imagePreview" src="" alt="Aperçu">
    </div>

    <label for="prompt">Consigne d'animation (Prompt) :</label>
    <textarea id="prompt" rows="5">Animate this character in a retro 70s psychedelic cartoon style, vibrant colors, dancing joyfully, smooth looping animation, reminiscent of the 'Love Is All' music video, high quality digital art.</textarea>

    <button onclick="generateVideo()">1. Créer une nouvelle vidéo</button>

    <hr style="margin-top: 30px; border: 0; border-top: 1px dashed #ccc;">

    <h3>Section de récupération (Suivi Officiel Agnes AI)</h3>
    <label for="recoveryId">Collez l'ID de votre tâche reçue :</label>
    <input type="text" id="recoveryId" value="">
    <button class="secours-btn" onclick="checkSpecificVideo()">2. Vérifier et Récupérer le Clip MP4</button>

    <div class="progress-bar-container" id="progContainer">
        <div class="progress-bar" id="progBar"></div>
    </div>

    <h3>Statut / Résultat :</h3>
    <div id="output">Collez votre clé API en haut, activez l'extension 'Allow CORS' sur votre navigateur, puis cliquez sur le bouton bleu !</div>
</div>

<script>
let pollingTimer = null;

function previewLocalImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('imagePreview');
        output.src = reader.result;
        document.getElementById('previewContainer').style.display = 'block';
    };
    if (event.target.files && event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

async function generateVideo() {
    const apiKey = document.getElementById('apiKey').value;
    const promptText = document.getElementById('prompt').value;
    const fileInput = document.getElementById('imageFileInput').files;
    const outputDiv = document.getElementById('output');

    if (!apiKey || !promptText || fileInput.length === 0) {
        alert("Veuillez remplir la clé API, le prompt et sélectionner une image.");
        return;
    }

    if(pollingTimer) clearInterval(pollingTimer);
    outputDiv.innerText = "Traitement et envoi à Agnes AI... Veuillez patienter.";

    try {
        const imageBase64 = await fileToBase64(fileInput[0]);
        const response = await fetch('https://apihub.agnes-ai.com/v1/videos', { 
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "agnes-video-v2.0",
                prompt: promptText,
                image: imageBase64,
                mode: "ti2vid"
            })
        });

        const data = await response.json();
        if (response.ok) {
            const taskId = data.video_id || data.id;
            document.getElementById('recoveryId').value = taskId;
            outputDiv.innerHTML = `<strong>Demande soumise !</strong><br>ID de la tâche : <code>${taskId}</code><br><br>⏳ Rendu lancé. Suivi automatique en cours...`;
            startPolling(taskId, apiKey);
        } else {
            outputDiv.innerText = "Erreur : " + JSON.stringify(data);
        }
    } catch (error) {
        outputDiv.innerText = "Erreur réseau : " + error.message;
    }
}

function checkSpecificVideo() {
    const apiKey = document.getElementById('apiKey').value;
    const taskId = document.getElementById('recoveryId').value;
    
    if (!apiKey) {
        alert("Veuillez entrer votre clé API en haut de la page.");
        return;
    }
    if (!taskId) {
        alert("Veuillez entrer un ID de tâche valide.");
        return;
    }

    if(pollingTimer) clearInterval(pollingTimer);
    startPolling(taskId, apiKey);
}

// CORRECTION DU FLUX DE SUIVI SELON LA DOC OFFICIELLE AGNES AI
function startPolling(taskId, apiKey) {
    const outputDiv = document.getElementById('output');
    const progContainer = document.getElementById('progContainer');
    const progBar = document.getElementById('progBar');
    
    progContainer.style.display = "block";
    progBar.style.width = "20%"; 
    outputDiv.innerText = "Demande d'état auprès d'Agnes API Hub...";

    pollingTimer = setInterval(async () => {
        try {
            // URL Officielle recommandée par la documentation de récupération
            const response = await fetch(`https://agnes-ai.com{encodeURIComponent(taskId)}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${apiKey}`
                }
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Recherche de l'URL finale dans l'objet de réponse
                const videoUrl = data.video_url || data.output || data.url || (data.metadata && data.metadata.url) || (data.data && data.data.video_url);
                const status = data.status ? data.status.toLowerCase() : "";

                if (videoUrl || status === "completed" || status === "success") {
                    clearInterval(pollingTimer);
                    progBar.style.width = "100%";
                    const finalLink = videoUrl || (data.data && data.data.video_url);
                    
                    outputDiv.innerHTML = `
                        <strong>🎉 Vidéo disponible !</strong><br><br>
                        <video class="video-result" controls autoplay loop style="max-width:100%;">
                            <source src="${finalLink}" type="video/mp4">
                        </video>
                        <br><br>
                        <a href="${finalLink}" target="_blank" download="clip_70s.mp4" style="display:inline-block; background:#28a745; color:white; padding:12px 20px; border-radius:4px; text-decoration:none; font-weight:bold; margin-top:10px;">💾 TÉLÉCHARGER LE CLIP MP4</a>
                    `;
                } else if (status === "failed") {
                    clearInterval(pollingTimer);
                    progContainer.style.display = "none";
                    outputDiv.innerText = "❌ Le rendu a échoué sur Agnes AI : " + JSON.stringify(data);
                } else {
                    progBar.style.width = "60%";
                    outputDiv.innerHTML = `⏳ Statut : <strong>${data.status || "Calcul en cours..."}</strong>.<br>L'IA génère votre clip (Vérification toutes les 4s).`;
                }
            } else {
                outputDiv.innerText = "Attente du serveur de calcul... Réponse brute : " + JSON.stringify(data);
            }
        } catch (error) {
            outputDiv.innerText = "Erreur de décodage ou CORS. Assurez-vous que l'extension 'Allow CORS' est active (ON).";
        }
    }, 4000); // Interrogation toutes les 4 secondes pour être plus réactif
}
</script>

</body>
</html>
