<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Vidéo - Style Love Is All</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #e91e63; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #c2185b; }
        .secours-btn { background-color: #007bff; margin-top: 10px; }
        .secours-btn:hover { background-color: #0056b3; }
        #output { margin-top: 25px; padding: 15px; background: #e9ecef; border-left: 5px solid #e91e63; min-height: 50px; white-space: pre-wrap; }
        .preview-box { margin-top: 10px; max-width: 200px; display: none; border-radius: 4px; overflow: hidden; }
        .preview-box img { width: 100%; height: auto; display: block; }
        .video-result { margin-top: 20px; width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h2>Créateur de Clip (Style "Love Is All")</h2>
    
    <label for="apiKey">Votre Clé API (Agnes AI) :</label>
    <input type="password" id="apiKey" placeholder="Entrez votre clé agnes_xxx...">

    <label for="imageFileInput">Image locale de référence (Illustration de votre dandy) :</label>
    <input type="file" id="imageFileInput" accept="image/*" onchange="previewLocalImage(event)">

    <div class="preview-box" id="previewContainer">
        <img id="imagePreview" src="" alt="Aperçu">
    </div>

    <label for="prompt">Consigne d'animation (Prompt) :</label>
    <textarea id="prompt" rows="5">Animate this character in a retro 70s psychedelic cartoon style, vibrant colors, dancing joyfully, smooth looping animation, reminiscent of the 'Love Is All' music video, high quality digital art.</textarea>

    <button onclick="generateVideo()">1. Créer une nouvelle vidéo</button>

    <hr style="margin-top: 30px; border: 0; border-top: 1px dashed #ccc;">

    <h3>Section de récupération (Pour votre vidéo existante)</h3>
    <label for="recoveryId">Collez l'ID de votre tâche reçue :</label>
    <input type="text" id="recoveryId" value="video_bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDphZ25lcy12aWRlby12Mi4wO3ZpZGVvX2lkOnZpZGVvX2I3ODhmODFlYTA1NTRkNDg4NTQ0YzQyMTkxODAyZWNm">
    <button class="secours-btn" onclick="openVideoDirectly()">2. Ouvrir le flux vidéo dans un nouvel onglet</button>

    <h3>Statut / Résultat :</h3>
    <div id="output">Sélectionnez vos fichiers, ou utilisez le bouton bleu pour votre vidéo existante !</div>
</div>

<script>
function previewLocalImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('imagePreview');
        output.src = reader.result;
        document.getElementById('previewContainer').style.display = 'block';
    };
    if(event.target.files && event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

async function generateVideo() {
    const apiKey = document.getElementById('apiKey').value;
    const promptText = document.getElementById('prompt').value;
    const fileInput = document.getElementById('imageFileInput').files;
    const outputDiv = document.getElementById('output');

    if (!apiKey || !promptText || fileInput.length === 0) {
        alert("Veuillez remplir la clé API, le prompt et sélectionner une image.");
        return;
    }

    outputDiv.innerText = "Traitement et envoi à Agnes AI...";

    try {
        const imageBase64 = await fileToBase64(fileInput[0]);
        
        // CORRECTION : Utilisation de l'URL officielle de l'API Hub
        const response = await fetch('https://agnes-ai.com', { 
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "agnes-video-v2.0",
                prompt: promptText,
                image: imageBase64,
                mode: "ti2vid"
            })
        });

        const data = await response.json();
        if (response.ok) {
            const taskId = data.video_id || data.id;
            document.getElementById('recoveryId').value = taskId;
            outputDiv.innerHTML = `<strong>Demande soumise !</strong><br>ID de la tâche : <code>${taskId}</code><br><br>Copiez cet ID, attendez 1 minute et cliquez sur le bouton bleu !`;
        } else {
            outputDiv.innerText = "Erreur : " + JSON.stringify(data);
        }
    } catch (error) {
        outputDiv.innerText = "Erreur réseau : " + error.message;
    }
}

function openVideoDirectly() {
    const taskId = document.getElementById('recoveryId').value;
    const outputDiv = document.getElementById('output');

    if (!taskId) {
        alert("Veuillez entrer un ID de tâche valide.");
        return;
    }

    outputDiv.innerHTML = "Ouverture du flux de données dans un nouvel onglet...";
    
    // CORRECTION : Redirection vers le point de récupération de l'API officielle
    const finalUrl = `https://agnes-ai.com/${taskId}`;
    window.open(finalUrl, '_blank');
}
</script>

</body>
</html>
