<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Vidéo - Style Love Is All</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #e91e63; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #c2185b; }
        #output { margin-top: 25px; padding: 15px; background: #e9ecef; border-left: 5px solid #e91e63; min-height: 50px; white-space: pre-wrap; }
        .preview-box { margin-top: 10px; max-width: 200px; display: none; border-radius: 4px; overflow: hidden; }
        .preview-box img { width: 100%; height: auto; display: block; }
        .duration-container { display: flex; align-items: center; gap: 15px; margin-top: 5px; }
        .duration-container input { width: auto; flex-grow: 1; }
        .duration-val { font-weight: bold; color: #e91e63; font-size: 16px; min-width: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Créateur de Clip (Style "Love Is All")</h2>
    
    <label for="apiKey">Votre Clé API (Agnes AI) :</label>
    <input type="password" id="apiKey" placeholder="Entrez votre clé agnes_xxx...">

    <label for="imageFileInput">Image locale de référence (Illustration de votre dandy) :</label>
    <input type="file" id="imageFileInput" accept="image/*" onchange="previewLocalImage(event)">

    <div class="preview-box" id="previewContainer">
        <img id="imagePreview" src="" alt="Aperçu">
    </div>

    <label for="durationSlider">Durée de la vidéo (Modèle 2.5 Flash) :</label>
    <div class="duration-container">
        <input type="range" id="durationSlider" min="4" max="12" value="5" oninput="document.getElementById('durationDisplay').innerText = this.value + 's'">
        <span class="duration-val" id="durationDisplay">5s</span>
    </div>

    <label for="prompt">Consigne d'animation (Prompt) :</label>
    <textarea id="prompt" rows="5">Animate this character in a retro 70s psychedelic cartoon style, vibrant colors, dancing joyfully, smooth looping animation, reminiscent of the 'Love Is All' music video, high quality digital art.</textarea>

    <button onclick="generateVideo()">Générer le Clip Vidéo</button>

    <h3>Statut / Résultat :</h3>
    <div id="output">Vérifiez que l'extension Allow CORS est bien activée (ON), puis cliquez sur Générer...</div>
</div>

<script>
function previewLocalImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('imagePreview');
        output.src = reader.result;
        document.getElementById('previewContainer').style.display = 'block';
    };
    reader.readAsDataURL(event.target.files);
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

async function generateVideo() {
    const apiKey = document.getElementById('apiKey').value;
    const promptText = document.getElementById('prompt').value;
    const videoDuration = document.getElementById('durationSlider').value;
    const fileInput = document.getElementById('imageFileInput').files;
    const outputDiv = document.getElementById('output');

    if (!apiKey || !promptText || fileInput.length === 0) {
        alert("Veuillez remplir la clé API, le prompt et sélectionner une image.");
        return;
    }

    outputDiv.innerText = "Connexion directe à Agnes AI en cours... Veuillez patienter.";

    try {
        const imageBase64 = await fileToBase64(fileInput[0]);

        // APPEL DIRECT SANS AUCUN PROXY
        const response = await fetch('https://agnes-ai.com', { 
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "agnes-video-2.5-flash",
                prompt: promptText,
                mode: "reference",
                images: [imageBase64],
                seconds: String(videoDuration),
                size: "720P",
                n: 1
            })
        });

        const data = await response.json();
        
        if (response.ok) {
            outputDiv.innerHTML = "<strong>Demande soumise avec succès !</strong><br>ID de la tâche : " + (data.video_id || data.id || "Génération lancée") + "<br><br>L'IA prépare votre animation rétro.";
        } else {
            outputDiv.innerText = "Réponse directe de l'API Agnes AI : " + JSON.stringify(data, null, 2);
        }
    } catch (error) {
        outputDiv.innerText = "Erreur réseau : " + error.message;
    }
}
</script>

</body>
</html>
