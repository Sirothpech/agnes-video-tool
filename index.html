<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Vidéo - Style Love Is All</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #e91e63; color: white; border: none; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #c2185b; }
        .secours-btn { background-color: #007bff; margin-top: 10px; }
        .secours-btn:hover { background-color: #0056b3; }
        #output { margin-top: 25px; padding: 15px; background: #e9ecef; border-left: 5px solid #e91e63; min-height: 50px; white-space: pre-wrap; }
        .preview-box { margin-top: 10px; max-width: 200px; display: none; border-radius: 4px; overflow: hidden; }
        .preview-box img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Créateur de Clip (Style "Love Is All")</h2>
    
    <label for="apiKey">Votre Clé API (Agnes AI) :</label>
    <input type="password" id="apiKey" placeholder="Entrez votre clé agnes_xxx...">

    <label for="imageFileInput">Image locale de référence (Illustration de votre dandy) :</label>
    <input type="file" id="imageFileInput" accept="image/*" onchange="previewLocalImage(event)">

    <div class="preview-box" id="previewContainer">
        <img id="imagePreview" src="" alt="Aperçu">
    </div>

    <label for="prompt">Consigne d'animation (Prompt) :</label>
    <textarea id="prompt" rows="5">A cinematic 70s psychedelic cartoon style, vibrant colors, character dancing joyfully, smooth looping animation, reminiscent of the 'Love Is All' music video, high quality digital art.</textarea>

    <button onclick="generateVideo()">1. Créer une nouvelle vidéo</button>

    <hr style="margin-top: 30px; border: 0; border-top: 1px dashed #ccc;">

    <h3>Section de récupération (Anti-blocage CORS)</h3>
    <label for="recoveryId">ID de la vidéo générée :</label>
    <input type="text" id="recoveryId" placeholder="video_xxx...">
    <button class="secours-btn" onclick="openVideoDirectly()">2. Ouvrir le flux vidéo dans un nouvel onglet</button>

    <h3>Statut / Résultat :</h3>
    <div id="output">Sélectionnez votre dandy, mettez votre clé API et cliquez sur le bouton 1.</div>
</div>

<script>
function previewLocalImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const output = document.getElementById('imagePreview');
        output.src = reader.result;
        document.getElementById('previewContainer').style.display = 'block';
    };
    if(event.target.files && event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
    }
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

// BOUTON 1 FLUIDE GRÂCE AU PROXY SÉCURISÉ D'ALLORIGINS
async function generateVideo() {
    const apiKey = document.getElementById('apiKey').value;
    const promptText = document.getElementById('prompt').value;
    const fileInput = document.getElementById('imageFileInput').files;
    const outputDiv = document.getElementById('output');

    if (!apiKey || !promptText || fileInput.length === 0) {
        alert("Veuillez remplir la clé API, le prompt et sélectionner une image.");
        return;
    }

    outputDiv.innerText = "Encapsulation CORS et envoi à Agnes AI... Veuillez patienter.";

    try {
        const imageBase64 = await fileToBase64(fileInput[0]);
        
        // On cible l'API officielle
        const targetUrl = 'https://apihub.agnes-ai.com/v1/videos';

        // On utilise la passerelle de secours AllOrigins qui accepte les requêtes POST complexes
        const response = await fetch(`https://allorigins.win{encodeURIComponent(targetUrl)}`, { 
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "agnes-video-v2.0",
                prompt: promptText,
                image: imageBase64,
                mode: "ti2vid"
            })
        });

        // Si le proxy répond mais qu'il y a un souci
        if (!response.ok) {
            // Tentative d'appel direct si le proxy est saturé
            const fallbackResponse = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: "agnes-video-v2.0", prompt: promptText, image: imageBase64, mode: "ti2vid" })
            });
            const fallbackData = await fallbackResponse.json();
            handleApiResponse(fallbackData, fallbackResponse.ok);
            return;
        }

        const data = await response.json();
        // AllOrigins encapsule la réponse dans data.contents
        const finalData = typeof data.contents === 'string' ? JSON.parse(data.contents) : data.contents;
        handleApiResponse(finalData, true);

    } catch (error) {
        outputDiv.innerText = "Erreur de transmission : " + error.message + "\nAssurez-vous que l'extension 'Allow CORS' est bien allumée (ON) en haut à droite pour sécuriser le flux local.";
    }
}

function handleApiResponse(data, isOk) {
    const outputDiv = document.getElementById('output');
    if (isOk && (data.video_id || data.id)) {
        const taskId = data.video_id || data.id;
        document.getElementById('recoveryId').value = taskId;
        outputDiv.innerHTML = `<strong>🎉 Demande soumise avec succès !</strong><br>ID de la tâche : <code>${taskId}</code><br><br>L'IA prépare votre clip. Attendez 1 à 2 minutes, puis cliquez sur le bouton bleu ci-dessous pour ouvrir votre vidéo !`;
    } else {
        outputDiv.innerText = "Réponse de l'API : " + JSON.stringify(data, null, 2);
    }
}

// BOUTON 2 DIRECT EN ONGLET (Pas de CORS possible)
function openVideoDirectly() {
    const taskId = document.getElementById('recoveryId').value;
    const outputDiv = document.getElementById('output');

    if (!taskId) {
        alert("Veuillez entrer un ID de tâche valide.");
        return;
    }

    outputDiv.innerHTML = "Ouverture de votre flux vidéo dans un nouvel onglet en cours...";
    
    // Récupération de l'adresse de suivi par ID de tâche ou vidéo
    const finalUrl = `https://agnes-ai.com{taskId}`;
    window.open(finalUrl, '_blank');
}
</script>

</body>
</html>
